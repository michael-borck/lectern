services:
  present:
    build: .
    ports:
      # Host port 3100, not the app's default 3000: cite-sight already
      # publishes 3000 on the host. Caddy proxies present.eduserver.au
      # to host.docker.internal:3100.
      - "3100:3000"
    environment:
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-dev}
      EMAIL_FROM: ${EMAIL_FROM:-present@localhost}
      ALLOWED_DOMAINS: ${ALLOWED_DOMAINS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    volumes:
      # decks land here via upload (read-write on purpose)
      - ./presentations:/app/presentations
      # SQLite: users, sessions, deck registry
      - ./data:/app/data
    restart: unless-stopped
