services:
  lectern:
    build: .
    ports:
      # Host port 3100, not the app's default 3000: cite-sight already
      # publishes 3000 on the host. Caddy proxies lectern.eduserver.au
      # to host.docker.internal:3100.
      - "3100:3000"
    environment:
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-dev}
      EMAIL_FROM: ${EMAIL_FROM:-lectern@localhost}
      ALLOWED_DOMAINS: ${ALLOWED_DOMAINS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # Caddy sits in front on the host. Set TRUST_PROXY=true only if port 3100
      # is firewalled so only the proxy can reach it — otherwise XFF is spoofable.
      TRUST_PROXY: ${TRUST_PROXY:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      MAX_WS_PER_IP: ${MAX_WS_PER_IP:-50}
      MAX_USER_BYTES: ${MAX_USER_BYTES:-524288000}
      MAX_DECK_BYTES: ${MAX_DECK_BYTES:-209715200}
      MAX_RATE_BUCKETS: ${MAX_RATE_BUCKETS:-50000}
    # LibreOffice on untrusted uploads: cap the blast radius
    mem_limit: 2g
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      # decks land here via upload (read-write on purpose);
      # the container runs as uid 1000: chown -R 1000:1000 presentations data
      - ./presentations:/app/presentations
      # SQLite: users, sessions, deck registry
      - ./data:/app/data
    restart: unless-stopped
