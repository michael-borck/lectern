services:
  present:
    build: .
    ports:
      # Host port 3100, not the app's default 3000: cite-sight already
      # publishes 3000 on the host. Caddy proxies present.eduserver.au
      # to host.docker.internal:3100.
      - "3100:3000"
    environment:
      PRESENTER_SECRET: ${PRESENTER_SECRET:?set PRESENTER_SECRET in .env or the shell}
    volumes:
      # decks are read from this host folder; drop a folder per talk here
      - ./presentations:/app/presentations:ro
    restart: unless-stopped
