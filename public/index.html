<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Presentation</title>
  <link rel="stylesheet" href="/reveal/reveal.css">
  <link rel="stylesheet" href="/reveal/theme/black.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="reveal">
    <div class="slides"></div>
  </div>
  <div id="hud" hidden>
    <span id="conn" title="connected"></span><span id="badge">PRESENTER</span>
    <span id="viewers-wrap"><span id="viewers">0</span> watching</span>
  </div>
  <div id="key-overlay" hidden>
    <form id="key-form">
      <label for="key-input">Presenter key</label>
      <input id="key-input" type="password" autocomplete="off" autofocus>
      <div class="row">
        <button type="submit">Start presenting</button>
        <button type="button" id="key-cancel">Just watch</button>
      </div>
    </form>
  </div>
  <script src="/reveal/reveal.js"></script>
  <script src="/viewer.js"></script>
</body>
</html>
