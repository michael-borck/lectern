name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: for f in *.js; do node --check "$f"; done
      - name: Dependency audit
        run: npm audit --omit=dev
      - name: Tests
        run: npm test
